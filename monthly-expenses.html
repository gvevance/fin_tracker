<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="description" content="Monthly expenses — Financial Tracker" />
    <title>Monthly expenses — Financial Tracker</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="top-bar">
      <a class="top-bar__back" href="index.html">← Home</a>
      <span class="top-bar__title">Monthly expenses</span>
    </header>
    <main class="page">
      <form id="month-form" class="card row">
        <label class="field field--grow">
          <span>Month</span>
          <input type="month" name="month" required />
        </label>
        <button type="submit" class="btn">Load</button>
      </form>

      <p id="month-total" class="month-total"></p>
      <p id="list-error" class="error hidden" role="alert"></p>
      <p id="list-empty" class="muted hidden">No expenses for this month.</p>
      <ul id="expense-list" class="expense-list"></ul>
    </main>
    <script src="js/main.js" type="module"></script>
    <script type="module" src="js/pages/monthly-expenses.js"></script>
  </body>
</html>
