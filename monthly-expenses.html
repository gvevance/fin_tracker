<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="description" content="Monthly expenses — Financial Tracker" />
    <title>Monthly expenses — Financial Tracker</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="top-bar">
      <a class="top-bar__back" href="home.html">← Home</a>
      <span class="top-bar__title">Monthly expenses</span>
    </header>
    <main class="page">
      <div class="card row">
        <label class="field field--grow">
          <span>Month</span>
          <input type="month" id="month-picker" name="month" required />
        </label>
      </div>
      <script>
        (function () {
          var el = document.getElementById("month-picker");
          if (!el) return;
          var d = new Date();
          el.value =
            d.getFullYear() +
            "-" +
            String(d.getMonth() + 1).padStart(2, "0");
        })();
      </script>

      <section id="month-summary" class="card summary-card" aria-live="polite">
        <h2 id="summary-title" class="summary-title">Monthly summary</h2>
        <p id="summary-total" class="summary-total">—</p>
        <p id="summary-meta" class="muted">Preparing…</p>
        <ul id="summary-categories" class="summary-categories"></ul>
      </section>

      <p id="list-error" class="error hidden" role="alert"></p>

      <div class="card filters-card">
        <label class="field filters-card__person">
          <span>Person</span>
          <span class="select-box">
            <select id="filter-user">
              <option value="">All people</option>
            </select>
          </span>
        </label>
        <label class="field">
          <span>Category</span>
          <span class="select-box">
            <select id="filter-category">
              <option value="">All categories</option>
            </select>
          </span>
        </label>
        <button type="button" id="clear-filters-btn" class="btn btn--small btn--ghost" disabled>
          Clear filters
        </button>
      </div>

      <h3 class="section-heading" id="list-heading">All expenses</h3>
      <p id="list-empty" class="muted hidden">No expenses for this month.</p>
      <ul id="expense-list" class="expense-list"></ul>
    </main>
    <script src="js/main.js" type="module"></script>
    <script type="module" src="js/pages/monthly-expenses.js"></script>
  </body>
</html>
